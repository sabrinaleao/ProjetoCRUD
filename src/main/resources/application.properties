spring.application.name=crud-produtos

# MySQL do XAMPP (usuario root, por padrao sem senha)
# A senha NAO fica no codigo: defina a variavel de ambiente DB_PASSWORD se tiver senha.
spring.datasource.url=jdbc:mysql://localhost:3306/produtos_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
